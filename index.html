<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>empeirik — build and diagnose circuits with an agent</title>
  <meta
    name="description"
    content="empeirik gives a browser agent direct, inspectable control of CircuitJS1 for circuit diagnosis and circuit building."
  />
  <link rel="icon" type="image/png" href="assets/empeirik-logo.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <h1>empeirik</h1>
    </div>
  </header>

  <main class="workspace-shell">
    <section class="simulator-panel" aria-label="CircuitJS1 workspace">
      <div class="circuitjs-slot" id="circuitjs-slot">
        <div class="runtime-message" id="circuitjs-empty">
          <span class="eyebrow">Simulator unavailable</span>
          <h2>Install the CircuitJS1 runtime</h2>
          <p>The session UI still loads, but arbitrary circuit building and live measurements require CircuitJS1.</p>
          <pre><code>npm run install:circuitjs
npm start</code></pre>
        </div>
      </div>
    </section>

    <aside class="session-panel" aria-label="Circuit activity">
      <div class="session-body">
        <section id="pending-section" class="pending-section" aria-labelledby="pending-title" hidden>
          <div class="section-label-row">
            <h3 id="pending-title">Needs you</h3>
            <span id="pending-count">0</span>
          </div>
          <div id="pending-actions"></div>
        </section>

        <section class="panel-stack" aria-label="Session workspace">
          <details class="bench activity-section" name="session-bench" data-bench="work-log" open>
            <summary>
              <span>Work log</span>
              <span id="work-log-count" class="bench-count">0</span>
            </summary>
            <div id="session-feed" class="session-feed bench-content"></div>
          </details>

          <details class="bench" name="session-bench" data-bench="investigation">
            <summary>
              <span>Investigation</span>
              <span id="investigation-count" class="bench-count">0</span>
            </summary>
            <div id="investigation-bench" class="bench-content"></div>
          </details>

          <details class="bench" name="session-bench" data-bench="evidence">
            <summary>
              <span>Evidence</span>
              <span id="evidence-count" class="bench-count">0</span>
            </summary>
            <div id="evidence-bench" class="bench-content"></div>
          </details>

          <details class="bench" name="session-bench" data-bench="hypotheses">
            <summary>
              <span>Hypotheses</span>
              <span id="hypothesis-count" class="bench-count">0</span>
            </summary>
            <div id="hypothesis-bench" class="bench-content"></div>
          </details>

          <details class="bench" name="session-bench" data-bench="repair">
            <summary>
              <span>Repair bench</span>
              <span id="repair-state" class="bench-count">Empty</span>
            </summary>
            <div id="repair-bench" class="bench-content"></div>
          </details>
        </section>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="src/circuit-adapter.js"></script>
  <script src="src/workspace.js"></script>
  <script src="src/webmcp.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
